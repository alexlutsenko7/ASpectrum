name=AAudioLinkFix
version=1.0.0
author=AlteraZX
maintainer=AlteraZX
sentence=Linker option for AAudio: wraps ESP-IDF bta_av_co_audio_set_codec (A2DP source crash fix).
paragraph=Carries no code. Arduino passes a library's ldflags to the linker only for a precompiled library, so src/esp32 holds an empty stub archive. The wrapper itself is in AAudio.ino.
category=Communication
url=https://github.com/alexlutsenko7/ASpectrum
architectures=esp32
precompiled=true
ldflags=-Wl,--wrap=bta_av_co_audio_set_codec
